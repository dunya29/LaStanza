<!--mail-form-->
<section class="section main-form mail-form">
    <div class="container">
        <div class="media-cover">
            <img src="img/mail-form-bg.jpg" alt="">
        </div>
        <div class="main-form__right">
            <div class="main-form__content">
                <h4>Подпишитесь и будьте в курсе интерьерных изменений</h4>
                <form action="" class="form" onsubmit="event.preventDefault();mailFormSuccess(this)">
                    <div class="item-form">
                        <input name="e-mail" type="text" placeholder="E-mail">
                        <span class="item-form__error"></span>
                    </div>
                    <div class="form__footer">
                        <label class="item-checkbox error">
                            <input type="checkbox" class="required form__agree">
                            <span>Я соглашаюсь с <a href="#" target="_blank">Политикой обработки персональных данных</a></span>
                            <span data-error>Необходимо согласиться с Политикой обработки персональных данных</span>
                        </label>
                        <button type="submit" class="btn main-btn">Подписаться</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
